name: attendance-env

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # core scientific stack
  - numpy>=1.24
  - pillow>=10.0
  - tqdm>=4.66
  - pyyaml>=6.0
  - scikit-learn>=1.3

  # computer vision
  - opencv

  # pytorch
  - pytorch>=2.1
  - torchvision>=0.16

  # pip packages
  - pip:
      - facenet-pytorch>=2.6.0
      - fastapi>=0.110
      - uvicorn>=0.27
      - python-multipart>=0.0.9
      - onnxruntime>=1.17
      - python-jose
      - google-auth
      - requests
      - python-dotenv